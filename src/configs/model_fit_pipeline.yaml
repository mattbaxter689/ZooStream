paths:
  output_dir: "./azure_ml_lora_output"
  artifact_name: "custom_metadata.json"

training:
  #TODO: adjust parameter. Left alone for quick testing
  max_seq_length: 256
  epochs: 2
  learning_rate: 0.0002
  batch_size: 2
  gradient_accumulation_steps: 4
  weight_decay: 0.01

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
