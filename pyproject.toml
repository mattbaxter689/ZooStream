[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log-stream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.4.1+cu124",
    "azure-ai-ml>=1.31.0",
    "azure-identity>=1.25.1",
    "azureml-mlflow==1.54.0",
    "black>=25.12.0",
    "transformers>=5.17.0",
    "datasets>=2.19.2",
    "evaluate>=0.4.6",
    "peft>=0.21.0",
    "trl>=0.12.0",
    "liger-kernel>=0.8.3",
    "mlflow<=2.16.2",
    "mlflow-skinny<=2.16.2",
    "optuna>=4.6.0",
    "optuna-integration>=4.6.0",
    "pandas>=2.3.3",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "ruff>=0.16.2",
    "setuptools<82.0.0",
    "bitsandbytes>=0.50.2",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

